<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="./hw2.css" />
  </head>
  <body>
    <div class="container">
      <button>
        <img src="Group 1.png" alt="menu button" />
      </button>
      <h1>Menu</h1>
      <input placeholder="Search food here" type="text" />
      <div class="menu-row">
        <div class="menu-items">
          <div class="menu-position">
            <div class="position-img">
              <img src="food.png" alt="food" />
            </div>
          </div>
          <h4>Food</h4>
        </div>
        <div class="menu-items gray-bg">
          <div class="menu-position">
            <div class="position-img">
              <img src="drinks.png" alt="drinks" />
            </div>
          </div>
          <h4>Drinks</h4>
        </div>
        <div class="menu-items gray-bg">
          <div class="menu-position">
            <div class="position-img">
              <img src="Dessert.png" alt="dessert" />
            </div>
          </div>
          <h4>Dessert</h4>
        </div>
        <h2 class="section-title">Burger</h2>
        <div class="section-row">
          <div class="burger-card">
            <img src="bigMac.png" alt="Burger" />
            <div class="burger-info">
              <h3 class="burger-tit">Big Mac</h3>
              <p class="burger-price">Rc 240</p>
            </div>
          </div>
          <div class="burger-card">
            <img src="KFC Double.png" alt="KFC" />
            <div class="burger-info">
              <h3 class="burger-tit">KFC Double</h3>
              <p class="burger-price">Rc 252</p>
            </div>
          </div>
          <div class="burger-card">
            <img src="Fish Burger.png" alt="Fish" />
            <div class="burger-info">
              <h3 class="burger-tit">Fish Burger</h3>
              <p class="burger-price">Rc 220</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
